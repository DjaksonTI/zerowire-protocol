syntax = "proto3";

package aml.distributed;

enum ParameterType {
  TYPE_STRING = 0;
  TYPE_INT32 = 1;
  TYPE_BOOLEAN = 2;
  TYPE_FLOAT = 3;
}

message ToolParameter {
  string name = 1;
  ParameterType type = 2;
  string description = 3;
  bool required = 4;
}

message ToolSchema {
  int32 tool_id = 1;
  string name = 2;
  string description = 3;
  repeated ToolParameter parameters = 4;
}

message PDFContext {
  string doc_id = 1;
  string filename = 2;
  bytes content_bytes = 3; // Field compressed via aml_protocol.dll
}

message AgentTransactionPayload {
  uint64 session_id = 1;
  uint32 sequence_number = 2;
  string sender_agent_id = 3;
  string target_agent_id = 4;
  
  bytes system_prompt = 5;      // Field compressed via aml_protocol.dll
  repeated ToolSchema tools = 6;
  PDFContext pdf_context = 7;
  bytes user_task = 8;          // Field compressed via aml_protocol.dll
  bytes llm_response = 9;       // Live Gemini output payload
}

message TransportResponse {
  bool success = 1;
  uint32 status_code = 2;
  string error_message = 3;
  AgentTransactionPayload payload = 4;
}

// Inter-Agent gRPC Transport Service
service AgentTransportService {
  rpc ExecuteAgentTask (AgentTransactionPayload) returns (TransportResponse);
}